# Generate Wider.xcodeproj with: xcodegen generate   (brew install xcodegen)
name: Wider
options:
  bundleIdPrefix: app.getwider
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: XY6GZ256WA
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Wider:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getwider.Wider
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Wider
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WiderExtension
        embed: true
  WiderExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      # A folder reference, so the web extension lands in the bundle as
      # Resources/ with its structure intact -- what Safari looks for.
      - path: Extension/Resources
        type: folder
        buildPhase: resources
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Wider
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_NAME: Wider Extension
        PRODUCT_BUNDLE_IDENTIFIER: app.getwider.Wider.Extension
